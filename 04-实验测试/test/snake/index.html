<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪吃蛇</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0d0d1a;
      font-family: 'Courier New', monospace;
      color: #fff;
      gap: 16px;
    }

    h1 {
      font-size: 1.5rem;
      letter-spacing: 0.3em;
      color: #00ff88;
      text-transform: uppercase;
    }

    #game-wrapper {
      position: relative;
    }

    #game-canvas {
      display: block;
      border: 2px solid #333;
      border-radius: 4px;
      image-rendering: pixelated;
    }

    #diff-panel {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(13, 13, 26, 0.92);
      border-radius: 2px;
    }

    #diff-panel h2 {
      font-size: 1.8rem;
      letter-spacing: 0.2em;
      color: #00ff88;
    }

    #diff-panel p {
      font-size: 0.85rem;
      color: #aaa;
      letter-spacing: 0.1em;
    }

    select, button {
      padding: 8px 20px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #1a1a2e;
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      outline: none;
    }

    button {
      background: #00ff88;
      color: #0d0d1a;
      font-weight: bold;
      border: none;
      letter-spacing: 0.1em;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.85; }

    #controls {
      font-size: 0.75rem;
      color: #555;
      letter-spacing: 0.05em;
      text-align: center;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <h1>Snake</h1>

  <div id="game-wrapper">
    <canvas id="game-canvas"></canvas>

    <div id="diff-panel">
      <h2>贪吃蛇</h2>
      <p>SELECT DIFFICULTY</p>
      <select id="difficulty">
        <option value="EASY">EASY — 慢速 20×20</option>
        <option value="NORMAL" selected>NORMAL — 标准 25×25</option>
        <option value="HARD">HARD — 极速 30×30</option>
      </select>
      <button id="btn-start">START GAME</button>
    </div>
  </div>

  <div id="controls">
    方向键 / WASD 移动 &nbsp;|&nbsp; SPACE 开始 &nbsp;|&nbsp; ESC 暂停
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
