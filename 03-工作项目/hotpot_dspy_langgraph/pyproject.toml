[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hotpot-dspy-langgraph"
version = "0.1.0"
description = "HotPotQA hard/fullwiki DSPy + LangGraph reference project for DashScope qwen3.6-plus"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "OpenAI ChatGPT" }
]
dependencies = [
  "dspy>=3.1.0",
  "langgraph>=0.2.0",
  "datasets>=2.18.0",
  "rank-bm25>=0.2.2",
  "python-dotenv>=1.0.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "orjson>=3.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
hotpot-dspy = "hotpot_dspy_langgraph.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
